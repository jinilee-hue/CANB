  .stage{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    /* env() is the ONLY inset source again (2026-08-26). The app used to wrap this
       WebView in a Flutter `SafeArea` as well, and since `env()` inside the WebView
       reports the WINDOW's insets regardless, the status bar was applied twice -
       measured on a tablet: screen 1280x800, innerHeight 755 (45px already removed),
       yet env(top) still said 30. That SafeArea is gone (gate_page.dart) so the page
       runs full-bleed and the gradient reaches the gesture bar; the padding below is
       what keeps content off it. The status bar is hidden by the app, so env(top) is
       0 there and the 8px is simply the design's own top gap.
       ★ Do not add a SafeArea back on the Flutter side without deleting these. */
    padding:
      calc(8px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(32px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    overflow:hidden;
  }

  /* ---- ambient starfield ---- */
  .deco{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  .sparkle{
    position:absolute;
    color:#eaf1ff;
    opacity:0.9;
    pointer-events:none;
  }
  .dot{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }

  /* ---- 마이페이지 ----
     A chip pinned to the top-right corner that drops a small panel: who is logged in,
     and the way out.

     ★ FIXED TO THE VIEWPORT, NOT PLACED IN .stage
       .stage's content column is centered and only min(560px, 92vw) wide, so a chip
       placed inside it would sit near the middle of a tablet screen rather than in the
       corner. Fixed positioning also keeps the chip out of the planet layout entirely -
       the grid is index-based and would otherwise have to leave a hole for it.

       The offsets repeat .stage's own padding (env(safe-area-inset-*)) rather than
       using round numbers: the app runs full-bleed with no SafeArea on the Flutter
       side, so this is the only thing keeping the chip out of a notch or a rounded
       corner.

     ★ z-index 40 IS DELIBERATELY BELOW THE NOTICE BACKDROP (50)
       A modal that a chip can be tapped through is not modal. */
  #myPage{
    position:fixed;
    top:calc(8px + env(safe-area-inset-top));
    right:calc(20px + env(safe-area-inset-right));
    z-index:40;
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap:8px;
  }
  /* 공지 자리를 마이페이지 칩 오른쪽 열(column)과 분리해 둔 것은, 드롭다운 패널이
     칩 바로 아래에서만 열려야 하기 때문이다 - #myPage 자체를 row 로 바꾸면 패널이
     티커 밑으로도 걸치게 된다. */
  /* ★ position:relative + 패널 absolute (디자인 리뷰 2026-09-04 3차 ③).
     패널이 흐름에 남아 있으면 열리는 순간 이 앵커의 폭이 칩(60px)에서 패널(240px)로
     늘어나고, #myPage 가 오른쪽 고정이라 그 차이만큼 왼쪽의 공지 영역이 밀려났다.
     앵커의 폭을 칩 하나로 고정해 두면 패널이 열려도 공지는 제자리에 있는다. */
  .mypage-anchor{
    position:relative;
    display:flex; flex-direction:column; align-items:flex-end;
  }
  /* 디자인 리뷰 2026-09-04 ②: 화살표(caret) 제거 - 칩은 아이콘 하나뿐인 원형 버튼이다.
     열림/닫힘 상태는 패널의 hidden 여부로 충분히 드러나므로 별도 인디케이터가 없어도
     된다. 아이콘 자체를 2배로 키웠으므로(20px -> 40px) 칩도 그 크기를 담을 원형으로
     맞춘다. */
  #myPageChip{
    display:flex; align-items:center; justify-content:center;
    width:60px; height:60px;
    padding:0;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(12,20,32,.52);
    color:var(--text-white);
    font-family:inherit;

       점선은 r 271 부터라 경계를 그 밖으로 옮기면 고정된 점선 조각이 비친다. 링 중심은
       캔버스 중심과 0.4px 이내라 회전해도 흔들리지 않는다. */
  /* 호버 움직임(떠오름·확대·눌림)은 네 시안 공통이다 (2026-10-19 요청 "a, b, d 도 c 처럼").
     시안마다 움직임이 다르면 그림이 아니라 모션을 비교하게 되므로 값은 시안 C 그대로 둔다. */
  .planet.has-concept{
    transform:translate(-50%,-50%) translateY(0) scale(var(--planet-scale, 1));
    transition:left .5s ease, top .5s ease, transform .3s cubic-bezier(.4,0,.2,1);
  }
  .planet.has-concept:hover{
    transform:translate(-50%,-50%) translateY(-10px) scale(calc(var(--planet-scale, 1) * 1.05));
  }
  .planet.has-concept:active{
    transform:translate(-50%,-50%) translateY(-10px) scale(calc(var(--planet-scale, 1) * .95));
  }
  /* 버튼이 10px 떠오르면 아래 가장자리에 있던 커서가 버튼 밖이 되어 호버가 풀렸다
     붙었다를 반복한다 - 떠오르는 만큼 아래로 투명한 히트 영역을 덧댄다. */
  .planet.has-concept::after{
    content:''; position:absolute;
    left:0; right:0; top:100%; height:12px;
  }
  .planet.has-concept:active .planet-sphere{ transform:none; } /* 기본 눌림(3px·0.96) 대신 위 0.95 하나만 */
  .planet.has-concept .planet-sphere{
    transition:transform .12s ease, box-shadow .3s cubic-bezier(.4,0,.2,1);
  }
  .planet.is-neon .planet-sphere{
    border-radius:50%;
    box-shadow:0 0 35px rgba(236,72,153,.6);
  }
  /* 호버 글로우는 시안(청록) 대신 테두리와 같은 핑크를 더 진하게 (2026-10-19 요청 - 파란 빛이
     테두리 색과 따로 놀았다). 가까운 22px 한 겹을 더해 평상시 35px·.6 보다 확실히 짙게. */
  .planet.is-neon:hover .planet-sphere{ box-shadow:0 0 22px rgba(236,72,153,.85), 0 0 55px rgba(236,72,153,.9); }

  /* 시안 A·B·D 글로우: 호버 때만, 각 타일의 고유색으로 (A 마젠타 · B 앰버 · D 바이올렛).
     평상시에는 두지 않는다 - 게이트의 다른 타일과 같은 규칙(디자인 리뷰 2026-09-04 3차 ①,
     타일 아래 그림자 금지). 시안 C 의 상시 핑크 글로우는 원본 시안 그대로라 예외.
     글로우가 타일 모양을 따르도록 sphere 모서리를 PNG 실측 반지름에 맞춘다(대각선 투명
     픽셀 수 / (1-1/sqrt2) / 폭: A 24.5% · B 26.5% · D 27.5%). 그림은 contain 이라 안 잘린다. */
  .planet[data-concept="A"] .planet-sphere.is-artwork{ border-radius:24.5%; box-shadow:0 0 0 rgba(217,70,239,0); }
  .planet[data-concept="B"] .planet-sphere.is-artwork{ border-radius:26.5%; box-shadow:0 0 0 rgba(251,191,36,0); }
  .planet[data-concept="D"] .planet-sphere.is-artwork{ border-radius:27.5%; box-shadow:0 0 0 rgba(124,92,255,0); }
  .planet[data-concept="A"]:hover .planet-sphere.is-artwork{ box-shadow:0 0 50px rgba(217,70,239,.85); }
  .planet[data-concept="B"]:hover .planet-sphere.is-artwork{ box-shadow:0 0 45px rgba(251,191,36,.8); }
  .planet[data-concept="D"]:hover .planet-sphere.is-artwork{ box-shadow:0 0 50px rgba(124,92,255,.9); }
  .vocanb-core{
    -webkit-mask-image:radial-gradient(circle closest-side, #000 95%, transparent 95.5%);
            mask-image:radial-gradient(circle closest-side, #000 95%, transparent 95.5%);
  }
  .vocanb-orbit{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    pointer-events:none;
    -webkit-mask-image:radial-gradient(circle closest-side, transparent 94.3%, #000 95%);
            mask-image:radial-gradient(circle closest-side, transparent 94.3%, #000 95%);
    animation:vocanb-orbit-spin 12s linear infinite;
  }
  @keyframes vocanb-orbit-spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .vocanb-orbit{ animation:none; }
  }

  /* ── 시안 설명 말풍선 ── 행성 위(꼬리 아래), 칩 아래(꼬리 위). 재질은 #myPagePanel. */
  .planet.has-concept:hover{ z-index:5; }
  .concept-bubble{
    position:absolute;
    left:50%;
    margin-left:var(--bubble-shift, 0px); /* 좁은 창에서 화면 밖으로 나가면 스크립트가 안쪽으로 민다 */
    bottom:calc(100% + 8px);
    z-index:3;
    width:300px;
    padding:12px 15px 13px;
    border-radius:14px;
    background:#0d1522;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 36px rgba(0,0,0,.42);
    color:var(--text-dim);
    font-family:inherit; font-size:13px; font-weight:600;
    line-height:1.6; letter-spacing:0;
    text-align:left; white-space:normal; word-break:keep-all;
    text-shadow:none;
    pointer-events:none;
    opacity:0; visibility:hidden;
    transform:translate(-50%, 6px);
    transition:opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
  }
  /* 꼬리: 같은 색 정사각형을 45° 돌려 절반만 내민다. 불투명이라 겹친 절반이 말풍선
     테두리를 덮고, 남은 두 변의 테두리가 꼬리 윤곽으로 이어진다. */
  .concept-bubble::after{
    content:'';
    position:absolute;
    left:50%; top:100%;
    width:12px; height:12px;
    margin:-6px 0 0 calc(-6px - var(--bubble-shift, 0px)); /* 말풍선이 밀린 만큼 꼬리는 되돌려 버튼을 가리킨다 */
    background:#0d1522;
    border-right:1px solid rgba(255,255,255,.16);
    border-bottom:1px solid rgba(255,255,255,.16);
    transform:rotate(45deg);
  }
  .concept-bubble-title{
    display:block;
    margin-bottom:6px;
    color:var(--text-white);
    font-size:14px; font-weight:800; line-height:1.45;
  }
  .concept-bubble-line{ display:block; }
  .concept-bubble-line + .concept-bubble-line{ margin-top:4px; }
  /* 칩 말풍선은 아래로 열린다. left -6px + 꼬리 30px = 칩 썸네일 중심(6+18=24px). */
  .concept-bubble.is-below{
    left:-6px; bottom:auto; top:calc(100% + 14px);
    transform:translateY(-6px);
  }
  .concept-bubble.is-below::after{
    left:30px; top:auto; bottom:100%;
    margin:0 0 -6px -6px;
    border:0;
    border-left:1px solid rgba(255,255,255,.16);
    border-top:1px solid rgba(255,255,255,.16);
  }
  .planet.has-concept:hover .concept-bubble,
  .planet.has-concept:focus-visible .concept-bubble{
    opacity:1; visibility:visible; transform:translate(-50%, 0);
    transition:opacity .18s ease, transform .18s ease, visibility 0s;
  }
  .concept-chip:hover .concept-bubble,
  .concept-chip:focus-visible .concept-bubble{
    opacity:1; visibility:visible; transform:translateY(0);
    transition:opacity .18s ease, transform .18s ease, visibility 0s;
  }
  /* 호버 때 버튼 전체가 1.05배(누르면 .95배)가 되는데 말풍선이 그 안에 있다 - 역배율로
     크기를 지키고, 버튼과 같은 .3s 곡선으로 움직여 도중에도 크기가 흔들리지 않게 한다. */
  .planet.has-concept .concept-bubble{ transform-origin:50% 100%; }
  .planet.has-concept:hover .concept-bubble{
    transform:translate(-50%, 0) scale(.95238);
    transition:opacity .18s ease, transform .3s cubic-bezier(.4,0,.2,1), visibility 0s;
  }
  .planet.has-concept:active .concept-bubble{ transform:translate(-50%, 0) scale(1.05263); }
  /* 행성이 5개가 되며 맨 왼쪽 자리(16.7%)가 생겼고, 배경 별(top 76%·left 14%)이 그
     이름표 위에 얹혔다 - 별만 왼쪽으로 비킨다. */
  .stage > .sparkle[style*="top:76%; left:14%"]{ left:7% !important; }

  /* ── 시안 A·B·D 상시 모션 (2026-10-19) ─────────────────────────────────────
     그림 위에 얹는 장식 레이어다(포인터 통과). 좌표·크기는 맨 아래 스크립트의 FX 표 -
     전부 PNG 실측값(그림 폭 대비 %)이라 그림을 바꾸면 다시 재야 한다.
       A: 테두리 베벨(안쪽 3%) 위를 도는 빛 + 별 반짝임
       B: 외눈 깜박임 + 별 반짝임
       D: 두 눈 깜박임 + 도토리 광택 + 별 반짝임
     호버 움직임(떠오름·확대·글로우)은 위 .has-concept 규칙 그대로 함께 돈다. */
  .vfx-star, .vfx-lid, .vfx-glint, .vfx-rim{ position:absolute; pointer-events:none; }

  /* 반짝임: 빛줄기 두 개(가로·세로)를 겹친 4각 별. 원래 그려진 별 위에서 커졌다 사라진다. */
  .vfx-star{
    left:var(--x); top:var(--y);
    width:var(--s); height:var(--s);
    margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2); /* % 는 컨테이너 폭 기준 - 타일이 정사각형이라 안전 */
    opacity:0;
    animation:vfx-twinkle var(--dur, 2.8s) ease-in-out var(--delay, 0s) infinite;
  }
  .vfx-star::before, .vfx-star::after{
    content:''; position:absolute; left:50%; top:50%;
    background:radial-gradient(closest-side, #fff 0%, var(--glow) 42%, transparent 100%);
    transform:translate(-50%, -50%);
  }
  .vfx-star::before{ width:100%; height:20%; }
  .vfx-star::after{ width:20%; height:100%; }
  @keyframes vfx-twinkle{
    0%, 58%, 100%{ opacity:0; transform:scale(.25) rotate(0deg); }
    74%{ opacity:1; transform:scale(1) rotate(20deg); }
    88%{ opacity:.4; transform:scale(.6) rotate(40deg); }
  }

  /* A 테두리 빛: 베벨과 같은 둥근 사각 경로(pathLength 100)를 따라 꼬리+머리 두 점선이
     시계방향으로 돈다. 머리는 꼬리 앞끝에 오도록 (18-5)/100 주기만큼 앞서 출발. */
  .vfx-rim{
    inset:0; width:100%; height:100%; overflow:visible;
    filter:drop-shadow(0 0 1.5px rgba(255,140,235,.95));
  }
  .vfx-rim rect{ fill:none; stroke-linecap:round; animation:vfx-rim-run 3.6s linear infinite; }
  .vfx-rim .vfx-rim-tail{ stroke:rgba(255,185,245,.6); stroke-width:1.2; stroke-dasharray:18 82; }
  .vfx-rim .vfx-rim-head{ stroke:#fff; stroke-width:1.7; stroke-dasharray:5 95; animation-delay:-.468s; }
  @keyframes vfx-rim-run{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:-100; } }

  /* 깜박임: 눈 크기 원(눈보다 조금 크게) 안에서 털색 눈꺼풀이 내려왔다 올라간다. 닫힌
     순간에는 눈꺼풀 가장자리를 원 밖으로 내리고(위로 20% 더 길게 만들어 위쪽은 안 비게)
     대신 감은 눈 곡선(::after)을 보인다 - 가장자리 선과 곡선이 두 줄로 겹치지 않게. */
  .vfx-lid{
    left:var(--x); top:var(--y);
    width:var(--w); height:var(--h);
    margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
    border-radius:50%;
    overflow:hidden;
  }
  .vfx-lid::before{
    content:''; position:absolute; top:-20%; left:0; right:0; bottom:0;
    background:var(--fur);
    border-bottom:var(--lash) solid #3a2836;
    border-radius:0 0 50% 50% / 0 0 30% 30%;
    transform:translateY(-110%);
    animation:vfx-blink var(--blink) ease-in-out var(--blink-delay) infinite;
  }
  .vfx-lid::after{
    content:''; position:absolute; left:18%; right:18%; top:34%; height:28%;
    border-bottom:var(--lash) solid #3a2836;
    border-radius:0 0 50% 50% / 0 0 100% 100%;
    opacity:0;
    animation:vfx-blink-line var(--blink) linear var(--blink-delay) infinite;
  }
  @keyframes vfx-blink{
    0%, 88%, 96%, 100%{ transform:translateY(-110%); }
    91%, 93%{ transform:translateY(10%); }
  }
  @keyframes vfx-blink-line{
    0%, 90.4%, 93.6%, 100%{ opacity:0; }
    91%, 93%{ opacity:1; }
  }

  /* D 도토리 광택: 도토리 모양 마스크(PNG 에서 추출해 스크립트에 data URI 로 둠) 안에서만
     빛 띠가 왼쪽→오른쪽으로 지나간다. */
  .vfx-glint{
    inset:0; overflow:hidden;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }
  .vfx-glint::before{
    content:''; position:absolute; top:0; bottom:0; left:0; width:55%;
    background:linear-gradient(105deg, rgba(255,255,255,0) 32%, rgba(255,252,230,.92) 50%, rgba(255,255,255,0) 68%);
    transform:translateX(-100%);
    animation:vfx-glint 3.6s ease-in-out infinite;
  }
  @keyframes vfx-glint{
    0%, 50%{ transform:translateX(-100%); }
    80%, 100%{ transform:translateX(190%); }
  }

  @media (prefers-reduced-motion: reduce){
    .vfx-star, .vfx-rim rect, .vfx-lid::before, .vfx-lid::after, .vfx-glint::before{ animation:none; }
  }
</style>
</head>

  <!-- logo (READi -> CANB APP) -->
  <div class="logo-wrap">

      <span class="c1">CANB</span><span class="c2">APP</span>

    </div>

<!-- 마이페이지. Outside .stage for the same reason the dialog below is: its fixed
     position must not be subject to that element's padding or overflow.
     The rows are filled from the `profile` the app sends; nothing about a campus or a
     level is written here, so adding a row is a services.json edit (CLAUDE.md §1-1).
     로그아웃 lives here now and NOWHERE ELSE - one button, moved rather than copied,
     because two copies drift the moment one is restyled. -->
<div id="myPage" hidden>
  <!-- 공지. Filled by script from TICKER_MESSAGES; stays hidden when there is nothing
       to say, so an empty list costs no space. 탭하면 그 시점 메시지를 아래 공지
       다이얼로그로 보여준다(임시 - 상세 화면 기획 확정 전, §8 참조). -->
  <div id="ticker" hidden role="button" tabindex="0" aria-label="공지 보기">
    <div id="tickerTrack" class="ticker-track"></div>
  </div>
  <div class="mypage-anchor">
    <button id="myPageChip" type="button" aria-expanded="false" aria-controls="myPagePanel" aria-label="내 정보">
      <span class="mypage-avatar" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" fill="#fff"/></svg>
      </span>
    </button>
    <div id="myPagePanel" hidden>
      <div id="myPageRows"></div>
      <div class="mypage-sep"></div>
      <button id="btnLogout" type="button" class="linkish">로그아웃</button>
    </div>
  </div>
</div>

<!-- ONE dialog, used by the 공지 and by a planet the user cannot enter. Sharing the
     element is what makes them share a theme - a second copy of this markup would drift
     the moment either is restyled. The "다시 보지 않기" row is hidden for callers that
     do not want it, so the alert form is 제목·본문·확인 only.
     Outside .stage so its fixed overlay is never subject to that element's
     overflow/padding. -->
<div id="noticeBackdrop" class="notice-backdrop" hidden>
  <div class="notice-card" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
    <h3 id="noticeTitle" class="notice-title"></h3>
    <p id="noticeBody" class="notice-body"></p>
    <label id="noticeCheckWrap" class="notice-check">
      <input id="noticeDismiss" type="checkbox">
      <span>다시 보지 않기</span>
    </label>
    <button id="noticeOk" type="button" class="notice-ok">확인</button>
  </div>
</div>

<script>
(() => {
  // JS -> Dart: relayed through the single 'CanbTotal' handler exposed by
  // gate_page.dart's addJavaScriptHandler. Queued the same way bridge_shim.dart
  // queues bridge calls, in case this script runs before the runtime is ready.
  const runtimeReady = () =>
    window.flutter_inappwebview
      && typeof window.flutter_inappwebview.callHandler === 'function';

  const queue = [];
  const deliver = (json) => window.flutter_inappwebview.callHandler('CanbTotal', json);
  const send = (action, payload) => {
    const json = JSON.stringify({ action, payload: payload || {} });
    if (runtimeReady()) { deliver(json); } else { queue.push(json); }
  };
  window.addEventListener('flutterInAppWebViewPlatformReady', () => {
    queue.splice(0).forEach(deliver);
  });

  const btnLogout = document.getElementById('btnLogout');
  const myPage = document.getElementById('myPage');
  const myPageChip = document.getElementById('myPageChip');
  const myPagePanel = document.getElementById('myPagePanel');
  const myPageRows = document.getElementById('myPageRows');
  const servicesEl = document.getElementById('services');
  const gateMsg = document.getElementById('gateMsg');
  const mockBanner = document.getElementById('mockBanner');
  const tickerEl = document.getElementById('ticker');
  const tickerTrack = document.getElementById('tickerTrack');
  const noticeBackdrop = document.getElementById('noticeBackdrop');
  const noticeTitle = document.getElementById('noticeTitle');
  const noticeBody = document.getElementById('noticeBody');
  const noticeDismiss = document.getElementById('noticeDismiss');
  const noticeCheckWrap = document.getElementById('noticeCheckWrap');
  const noticeOk = document.getElementById('noticeOk');

  // ── 소통 창구 ──────────────────────────────────────────────────────────────
  //
  // Both the ticker lines and the notice live HERE, in the page, not in services.json
  // and not in Dart. This page is served remotely (CANBGate's nginx), so changing what
  // it says is one scp and no app release. services.json is a service registry and a
  // notice is not a service; putting the copy in Dart would mean shipping a build to
  // fix a typo.
  //
  // 테스트용 임의 문구다. Replace when real copy exists.
  const TICKER_MESSAGES = [
    '겨울 특강 수강 신청이 시작되었습니다. 자세한 내용은 홈페이지를 확인해 주세요.',
    '앱 이용 중 불편한 점은 학습 담당 선생님에게 알려 주세요.',
  ];

  // `id` is not decoration: "다시 보지 않기" is remembered per notice, so a notice with
  // no id (or a reused one) would silently stay dismissed forever and the next notice
  // would never be seen. Give every new notice a new id.
  const NOTICE = {
    id: 'notice-2026-08-25-01',
    title: '통합 앱 안내',
    body: '테스트용 임의 공지입니다.\n\n한 번 로그인하면 홈페이지·READi·Alex 를 추가 로그인 없이 이용할 수 있습니다. 결제와 수강 신청은 학부모 계정으로 홈페이지에 로그인해 주세요.',
  };

  const NOTICE_STORE_KEY = 'canbtotal.notice.dismissed';

  // localStorage is per-origin and this page has one, so the flag survives app restarts
  // without the app needing any storage of its own. Every access is guarded: a browsing
  // context can refuse storage outright (private mode, blocked site data), and a notice
  // must never be able to break the gate it is drawn on top of. Failing to read means
  // the notice shows again - the harmless direction.
  const readDismissed = () => {
    try {
      const raw = window.localStorage.getItem(NOTICE_STORE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  };

  const rememberDismissed = (id) => {
    try {
      const next = readDismissed();
      if (!next.includes(id)) next.push(id);
      // Keeps the list from growing without bound across years of notices.
      window.localStorage.setItem(NOTICE_STORE_KEY, JSON.stringify(next.slice(-50)));
    } catch (e) { /* storage unavailable - the notice will show again, which is fine */ }
  };

  // ---- 마이페이지 ----
  // `rows` is [{label, value}, ...] exactly as the app sent it, already in draw order.
  // The panel is shown even when there are no rows: member-info can fail, and losing
  // the profile must not take 로그아웃 away with it - that would leave the user with no
  // way out of the app but to kill it.
  const renderProfile = (rows) => {
    myPage.hidden = false;
    myPageRows.innerHTML = '';

    const list = Array.isArray(rows) ? rows : [];
    list.forEach(({ label, value }) => {
      if (!label || !value) return;
      const row = document.createElement('div');
      row.className = 'mypage-row';
      const l = document.createElement('span');
      l.className = 'mypage-label';
      l.textContent = label;
      const v = document.createElement('span');
      v.className = 'mypage-value';
      v.textContent = value;
      row.append(l, v);
      myPageRows.appendChild(row);
    });

    // The first row is the person - naming the chip after them is what makes it read
    // as "you" rather than as a menu (screen reader only now that the chip itself is
    // an icon, not text). With no rows it stays the generic label.
    const name = list.length && list[0].value ? list[0].value : '내 정보';
    myPageChip.setAttribute('aria-label', name);
    myPageRows.hidden = !list.length;
  };

  const setMyPageOpen = (open) => {
    myPagePanel.hidden = !open;
    // aria-expanded is the state; the caret rotation is driven off it in CSS, so the
    // two cannot say different things.
    myPageChip.setAttribute('aria-expanded', open ? 'true' : 'false');
  };

  myPageChip.addEventListener('click', (e) => {
    // Without this the document listener below sees the same click and closes it again.
    e.stopPropagation();
    setMyPageOpen(myPagePanel.hidden);
  });

  // A dropdown, not a modal: no focus trap, no backdrop. It closes the two ways a
  // dropdown is expected to - tapping elsewhere, or Escape.
  document.addEventListener('click', (e) => {
    if (!myPagePanel.hidden && !myPage.contains(e.target)) setMyPageOpen(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !myPagePanel.hidden) setMyPageOpen(false);
  });

  // 세로로 한 줄씩 넘어가는 공지 - 가로 마퀴(-50% 무한 스크롤) 대신, 일정 간격마다
  // translateY 로 다음 줄로 슬라이드하고, 목록을 두 번 렌더링해 뒤로 돌아갈 때도
  // 역방향으로 미끄러지지 않고 자연스럽게 이어지게 한다(원래 가로 버전의 seamless
  // loop 트릭을 세로·단계별 이동으로 옮긴 것).
  const TICKER_ROTATE_MS = 3500;
  const TICKER_ITEM_HEIGHT = 64; // .ticker-item 의 height 와 맞춘다 (디자인 리뷰 2차 ④, 32 -> 64).
  let tickerItems = [];
  let tickerIndex = 0;
  let tickerTimer = null;

  const currentTickerMessage = () =>
    tickerItems.length ? tickerItems[tickerIndex % tickerItems.length] : '';

  const stepTicker = () => {
    tickerIndex += 1;
    tickerTrack.style.transform = `translateY(${-tickerIndex * TICKER_ITEM_HEIGHT}px)`;
    if (tickerIndex === tickerItems.length) {
      // 복제된 두 번째 목록의 첫 줄까지 다 왔다 - 첫 번째 목록의 첫 줄과 내용이
      // 같으므로, 전환이 끝난 뒤 티 안 나게 처음으로 되돌린다.
      window.setTimeout(() => {
        tickerTrack.style.transition = 'none';
        tickerIndex = 0;
        tickerTrack.style.transform = 'translateY(0)';
        void tickerTrack.offsetHeight; // reflow so the next transition re-applies
        tickerTrack.style.transition = '';
      }, 420);
    }
  };

  const renderTicker = () => {
    const items = (TICKER_MESSAGES || []).filter((t) => t && t.trim());
    if (tickerTimer) {
      window.clearInterval(tickerTimer);
      tickerTimer = null;
    }
    tickerItems = items;
    tickerIndex = 0;
    tickerTrack.style.transition = 'none';
    tickerTrack.style.transform = 'translateY(0)';
    tickerTrack.innerHTML = '';

    if (!items.length) {
      tickerEl.hidden = true;
      return;
    }
    tickerEl.hidden = false;
    // Twice - see the #ticker comment. The duplicate is what makes the wrap seamless.
    [...items, ...items].forEach((text) => {
      const el = document.createElement('div');
      el.className = 'ticker-item';
      // 말줄임은 이 span 이 받는다 - .ticker-item 자체는 flex 컨테이너라 거기에 건
      // text-overflow 는 안쪽 텍스트에 적용되지 않고 글자가 그냥 잘린다.
      const line = document.createElement('span');
      line.className = 'ticker-line';
      line.textContent = text;
      el.appendChild(line);
      tickerTrack.appendChild(el);
    });
    void tickerTrack.offsetHeight;
    tickerTrack.style.transition = '';

    const reduceMotion = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion && items.length > 1) {
      tickerTimer = window.setInterval(stepTicker, TICKER_ROTATE_MS);
    }
  };

  // 탭하면 그 시점 메시지를 기존 공지 팝업으로 보여준다 - 상세 화면 자체의 기획이
  // 없어 임시로 재사용한 것(§8). 상세 기획이 나오면 이 핸들러만 바꾸면 된다.
  tickerEl.addEventListener('click', () => {
    if (!tickerItems.length) return;
    openDialog({ title: '안내', body: currentTickerMessage(), showDismiss: false });
  });
  tickerEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      tickerEl.click();
    }
  });

  // The one dialog, opened by two callers. `onOk` runs on 확인 and nothing else - the
  // dialog itself never decides what dismissing means.
  let dialogOnOk = null;
  const openDialog = ({ title, body, showDismiss, onOk }) => {
    noticeTitle.textContent = title || '';
    noticeBody.textContent = body || '';
    noticeCheckWrap.hidden = !showDismiss;
    noticeDismiss.checked = false;
    dialogOnOk = onOk || null;
    noticeBackdrop.hidden = false;
  };

  noticeOk.addEventListener('click', () => {
    const done = dialogOnOk;
    dialogOnOk = null;
    noticeBackdrop.hidden = true;
    if (done) done({ dismissChecked: noticeDismiss.checked });
  });

  // Shown once per load of this page, which is once per login: the gate is pushed fresh
  // after LoginPage, while coming back from a service only re-sends 'state' to the page
  // already standing. A notice that reappeared every time the user stepped out of READi
  // would train them to dismiss it unread.
  let noticeShown = false;
  const showNoticeOnce = () => {
    if (noticeShown) return;
    noticeShown = true;
    if (!NOTICE || !NOTICE.id || !NOTICE.title) return;
    if (readDismissed().includes(NOTICE.id)) return;
    // Never over a dialog the user is already reading. `state` arrives once per login
    // before anything is tappable, so in practice this only guards a re-render.
    if (!noticeBackdrop.hidden) return;
    openDialog({
      title: NOTICE.title,
      body: NOTICE.body || '',
      showDismiss: true,
      onOk: ({ dismissChecked }) => {
        if (dismissChecked) rememberDismissed(NOTICE.id);
      },
    });
  };

  // Sphere colors cycle by position in the list, never by service id - adding a
  // service to services.json is still enough on its own (CLAUDE.md §1-1).
  const PLANET_PALETTE = [
    ['#7fe0d6', '#2f9c95'],
    ['#f5b8c4', '#d46a86'],
    ['#c98fe0', '#8b4fc2'],
    ['#ffd27f', '#e08a2f'],
    ['#8be0e6', '#3aa0c2'],
    ['#d7e26a', '#9aab1f'],
  ];

  // 행성이 얹히는 궤도선. .planets 안의 퍼센트 좌표(가로 0~100, 세로 0~100)로 정의한
  // 타원 하나이며, 화면 좌우 끝을 넘어가도록 rx 가 50 보다 크다 - 그래서 컨테이너
  // 안에서는 완만한 호로만 보인다 (디자인 리뷰 2026-09-04 3차 ④, READi 게이트 화면
  // 캡처 기준: 아이콘들이 하나의 긴 곡선 위에 얹히고 그 선이 아이콘 뒤를 관통한다).
  //
  // ★ 이 상수가 선과 행성 위치의 유일한 출처다. 아래 planetArc 엘리먼트의 좌표도
  //   여기서 받아 쓴다 - 두 벌로 적으면 선과 행성이 조용히 어긋난다.
  // ★ cy - ry 가 행성이 놓이는 높이(컨테이너 상단에서 55%)다. 이 컨테이너는 로고 아래
  //   남은 공간 전부를 차지하므로, 로고 여백까지 감안하면 실화면에서는 위에서 약 64%
  //   지점이 된다 (H=800·873·929 로 계산해도 63~65% 로 거의 움직이지 않는다).
  //   3차 때는 70%("하단에서 30%")였고, 4차 ④ 로 가운데 빈 띠를 좁히려 조금 올렸다 -
  //   .logo-wrap 의 위 여백과 짝이며, 한쪽만 바꾸면 여백이 옮겨갈 뿐 줄지 않는다.
  const ARC = { cx:50, cy:135, rx:90, ry:80 };
  const arcTopAt = (x) => {
    const t = (x - ARC.cx) / ARC.rx;
    return ARC.cy - ARC.ry * Math.sqrt(Math.max(0, 1 - t * t));
  };

  const planetArc = document.getElementById('planetArc');
  planetArc.setAttribute('cx', ARC.cx);
  planetArc.setAttribute('cy', ARC.cy);
  planetArc.setAttribute('rx', ARC.rx);
  planetArc.setAttribute('ry', ARC.ry);

  // Positions a planet by index only, never by service id (CLAUDE.md §1-1). 가로는
  // 개수로 균등 분할하고(READi 웹 메인의 개수별 고정 그리드 방식, CANB_ON_FRONT/front/
  // src/pages/main/components/SubjectIconArea.tsx 실측), 세로는 그 x 에서의 궤도선
  // 높이를 그대로 쓴다 - 곡선을 따로 흉내 내지 않고 선 위에 얹으므로 몇 개가 오든
  // 행성은 정확히 선 위에 있다.
  const MAX_COLS = 5;
  const ROW_LIFT = 22; // 한 줄을 넘어가면 그만큼씩 궤도선 위로 띄운다 (퍼센트 포인트)
  const gridSlot = (i, total) => {
    const cols = Math.min(total, MAX_COLS);
    const row = Math.floor(i / cols);
    const rowStart = row * cols;
    const itemsInRow = Math.min(cols, total - rowStart);
    const colIndex = i - rowStart;

    const left = (100 / (itemsInRow + 1)) * (colIndex + 1);
    return { left, top: arcTopAt(left) - row * ROW_LIFT };
  };

  /* Entitlement state -> how the planet reads. 'entitled' and 'notChecked' get no
     badge: the first passed a check, the second was never checked, and neither is a
     refusal. 'checkFailed' is deliberately worded as a check problem, never as
     non-payment (기획서 5.3). 'authFailed' never reaches here - Dart escalates a
     credential problem to the login step instead of grey-ing out a planet. */
  /* `guide` is what the dialog adds under the reason when the planet is tapped. It is
     keyed by STATE, never by service - services are a growing list and states are a
     closed set Dart owns (CLAUDE.md §1-1). ★ `unpaid` and `ineligible` get the purchase
     line, nothing else: a failed CHECK told to go and buy something is the exact
     confusion 기획서 5.3 and CLAUDE.md's entitlement section forbid. */
  const PURCHASE_GUIDE = '홈페이지에서 학부모 로그인 후 구매가 가능합니다.';
  const BADGE_BY_STATE = {
    unpaid: {
      cls:'is-unpaid',
      fallback:'등록이 필요합니다',
      guide:PURCHASE_GUIDE,
    },
    // Same reason text AND guide as `unpaid` on purpose. Reason unified 2026-09-03
    // (product call). Guide unified 2026-10-12 (QA #22676): READi 15
    // (ERROR_NO_CLASS_LECTURE) lands here while Alex 511 lands on `unpaid`, so the same
    // unregistered student saw the purchase line on one planet and not the other. Only
    // the dialog text is shared. Badge colour unified 2026-10-12 too (QA #22677,
    // yellow chosen): the same two planets drew one yellow and one grey label for the
    // same "등록이 필요합니다". The state itself stays `ineligible`.
    ineligible: {
      cls:'is-unpaid',
      fallback:'등록이 필요합니다',
      guide:PURCHASE_GUIDE,
    },
    accountBlocked: { cls:'is-blocked',  fallback:'계정 상태를 확인해 주세요' },
    checkFailed:    { cls:'is-failed',   fallback:'이용 여부를 확인하지 못했어요' },
  };

  // A planet is locked either because services.json turned the service off or because
  // the entitlement judgement refuses entry. Both need something to say when tapped.
  const LOCKED_FALLBACK = '지금은 이용할 수 없어요.';

  // Renders whatever services.json declared - no service name appears in this file (CLAUDE.md §1-1).
  const renderServices = (services) => {
    // 궤도선 SVG 는 정적 마크업이라 innerHTML 로 통째로 지우면 같이 날아간다 - 행성만 걷어낸다.
    servicesEl.querySelectorAll('.planet').forEach((el) => el.remove());
    const total = (services || []).length;
    (services || []).forEach((s, i) => {
      const [light, dark] = PLANET_PALETTE[i % PLANET_PALETTE.length];
      const label = (s.displayName || s.id || '?').trim();

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'planet';
      btn.dataset.serviceId = s.id; // voCANB 시안 비교 스크립트가 이 행성을 찾는 손잡이 (리뷰용)
      // Tracked as a variable rather than read back off the element, because the button
      // stays clickable on purpose - see the `aria-disabled` rule in the CSS.
      let locked = !s.enabled;
      let lockedReason = LOCKED_FALLBACK;
      let lockedGuide = '';

      const slot = gridSlot(i, total);
      btn.style.left = `${slot.left}%`;
      btn.style.top = `${slot.top}%`;
      // Uniform size for every planet - the one exception is data-driven
      // (services.json's compactIcon), never a service id check (CLAUDE.md §1-1).
      btn.style.setProperty('--planet-scale', s.compactIcon ? 0.62 : 1);

      const orbit = document.createElement('span');
      orbit.className = 'planet-orbit';

      const sphere = document.createElement('span');
      sphere.className = 'planet-sphere';
      sphere.style.background =
        `radial-gradient(circle at 32% 28%, ${light}, ${dark})`;
      // An icon is the service's own artwork, handed over by Dart as a data URI
      // (the page is remote, so it cannot reach the app's asset bundle). No icon
      // declared - or one that failed to load - falls back to the name's initial,
      // so a new service in services.json still shows up without artwork.
      const icon = s.icon;
      if (icon && icon.src) {
        const img = document.createElement('img');
        img.className =
          'planet-icon' + (icon.fit === 'contain' ? ' is-contain' : '');
        img.src = icon.src;
        img.alt = '';
        sphere.appendChild(img);
      } else {
        const glyph = document.createElement('span');
        glyph.className = 'planet-glyph';
        glyph.textContent = [...label][0]?.toUpperCase() || '?';
        sphere.appendChild(glyph);
      }

      orbit.appendChild(sphere);

      const caption = document.createElement('span');
      caption.className = 'planet-caption';
      const name = document.createElement('span');
      name.className = 'planet-name';
      name.textContent = label;
      const go = document.createElement('span');
      go.className = 'planet-go';
      go.textContent = '›';
      caption.appendChild(name);
      caption.appendChild(go);

      btn.appendChild(orbit);
      btn.appendChild(caption);
      // Only when there is something to say. An empty span is still a flex item and
      // still claims a line's height, so a service that deliberately has no subtitle
      // (services.json may omit it) would sit lower than its neighbours for no reason.
      if (s.subtitle) {
        const sub = document.createElement('span');
        sub.className = 'planet-sub';
        sub.textContent = s.subtitle;
        btn.appendChild(sub);
      }

      // The entitlement block is absent until a login has produced a result for this
      // service; absent means "not judged", which is not the same as "allowed".
      const ent = s.entitlement;
      if (ent) {
        if (!ent.allowsEntry) locked = true;
        const badge = BADGE_BY_STATE[ent.state];
        if (badge) {
          // The server/config-supplied reason wins; the fallback only names the kind
          // of problem so a missing message never reads as a payment problem.
          const reason = ent.message || badge.fallback;
          if (!ent.allowsEntry) {
            lockedReason = reason;
            lockedGuide = badge.guide || '';
          }
          const el = document.createElement('span');
          el.className = `planet-badge ${badge.cls}`;
          el.textContent = reason;
          btn.appendChild(el);
        }
      }

      if (locked) btn.setAttribute('aria-disabled', 'true');

      btn.addEventListener('click', () => {
        gateMsg.textContent = '';
        if (locked) {
          // Says why, in the same dialog the 공지 uses, with 확인 as the only action.
          // The service's own name is the title so the dialog stands on its own - it
          // comes from services.json like everything else here (CLAUDE.md §1-1).
          openDialog({
            title: label,
            body: lockedGuide ? `${lockedReason}\n\n${lockedGuide}` : lockedReason,
            showDismiss: false,
          });
          return;
        }
        send('enterService', { serviceId: s.id });
      });
      servicesEl.appendChild(btn);
    });
  };

  // Dart -> JS: gate_page.dart evaluates 'window.canbTotal.receive(<json>)' directly,
  // so this receives an already-parsed object, not a JSON string. This page only ever
  // loads after login already succeeded (LoginPage), so 'state' always means
  // authenticated - no login-view branch here.
  window.canbTotal = {
    receive(msg) {
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'state') {
        mockBanner.hidden = !msg.mockAuth;
        renderServices(msg.services);
        gateMsg.textContent = msg.partial || '';
        // Absent `profile` is a normal state (member-info unreachable), not an error -
        // renderProfile falls back to the generic chip and keeps 로그아웃 reachable.
        renderProfile(msg.profile);
        // After the planets, so it never opens over an empty gate.
        showNoticeOnce();
      } else if (msg.type === 'enterFailed') {
        gateMsg.textContent = msg.reason || '지금은 들어갈 수 없어요.';
      }
    },
  };

  btnLogout.addEventListener('click', () => {
    // Closed before leaving, so returning to a logged-out gate does not find the panel
    // still open over the login screen's own state.
    setMyPageOpen(false);
    send('logout');
  });

  renderTicker();
  send('ready');

9DULm1ceQzqxhTA26x3PtO4JXqqXyM3lsggihmQn3EecrOG7XIN1sQZxImWS5WSS2ZQJlo3OPrcnR04nebW+uieIGJKdOMM8neSXSZ6of/dJkn/Uy+exlOeBP6whnM2d2ee5NUaLqy2VOdPhfRYRQzrwszOX5I9Jnk45PqC5j3irNclyvQbv4xq3wzWK7dHidI3nIGWRt6UyiCEZ1Q1if1jlSY/l1iVvM/t8qYaxGS2erJfTEzV4VyyVwTpDRnEh9qF6mXwoZfPUT9fZJmu8dXk8XUeGD7dGht85xhMxJCM6gTKdsuD635vcPHW1pTfLZokRQ0Y5iuOrLMwGMQRwVCiAGAKIIYAYAoghgBgCiCGAGAKIIYAYAoghgBgCiCGAGAKIIYAYAoghgBgCiCGAGAKIIYAYAoghgBgCiCGAGAKIIYAYAoghAGIIIIYAYghwx/8AwEhnaXkHa38AAAAASUVORK5CYII=';
  const FX = {
    A: {
      rim: { inset: 3, radius: 21.5 }, // 베벨: 안쪽 23~27px/822px ≈ 3%, 모서리 반지름 24.5% - 3%
      glow: 'rgba(150,232,255,.8)',
      stars: [
        [80.8, 38.7, 17], [22.4, 48.6, 15, 'rgba(255,214,170,.85)'], [58.1, 16.2, 11],
        [49.5, 28.4, 9, 'rgba(255,175,215,.85)'], [17.4, 27.3, 8], [74.7, 52.8, 7, 'rgba(255,175,215,.85)'],
      ],
    },
    B: {
      glow: 'rgba(255,236,150,.85)',
      stars: [[19.9, 32.2, 16], [79.0, 25.6, 14], [85.8, 37.0, 12], [14.9, 59.3, 13], [84.0, 60.2, 9], [90.8, 76.6, 8]],
      // 외눈: 흰자 원 중심 (49.2%, 39.3%) 지름 19.5% → 바깥 음영까지 덮도록 1.14배.
      // 털색은 위 민트 → 아래 노랑 그라데이션이라 눈꺼풀도 같은 순서로 칠한다(주변 실측색).
      blink: {
        dur: 4.2, delay: -2.5,
        eyes: [{ x: 49.16, y: 39.27, w: 22.2, h: 22.2, lash: 1.6,
                 fur: 'linear-gradient(180deg, #afe3d4 0%, #bcdcbc 30%, #d0d39a 52%, #e2c27a 76%, #f0c27a 100%)' }],
      },
    },
    D: {
      glow: 'rgba(225,195,255,.85)',
      stars: [[17.7, 32.8, 11], [80.2, 23.2, 10], [20.9, 74.5, 9], [89.2, 75.9, 7], [13.9, 49.1, 6]],
      // 두 눈: 지름 약 5.1% → 1.35배. 눈 주변 털색 실측 평균.
      blink: {
        dur: 4.8, delay: -1.2,
        eyes: [
          { x: 39.63, y: 42.40, w: 6.9, h: 7.1, lash: 1, fur: '#ecc1b3' },
          { x: 59.57, y: 42.37, w: 6.8, h: 7.4, lash: 1, fur: '#dfab9f' },
        ],
      },
      glint: ACORN_MASK,
    },
  };

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const fxEl = (cls, vars) => {
    const el = document.createElement('i');
    el.className = cls;
    el.setAttribute('aria-hidden', 'true');
    Object.entries(vars || {}).forEach(([k, v]) => el.style.setProperty(k, v));
    return el;
  };
  const addFx = (box, fx) => {
    if (fx.rim) {
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('class', 'vfx-rim');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('aria-hidden', 'true');
      const side = 100 - fx.rim.inset * 2;
      ['tail', 'head'].forEach((part) => {
        const r = document.createElementNS(SVG_NS, 'rect');
        r.setAttribute('class', `vfx-rim-${part}`);
        r.setAttribute('x', fx.rim.inset);
        r.setAttribute('y', fx.rim.inset);
        r.setAttribute('width', side);
        r.setAttribute('height', side);
        r.setAttribute('rx', fx.rim.radius);
        r.setAttribute('pathLength', '100');
        svg.appendChild(r);
      });
      box.appendChild(svg);
    }
    if (fx.glint) {
      const g = fxEl('vfx-glint');
      g.style.webkitMaskImage = `url("${fx.glint}")`;
      g.style.maskImage = `url("${fx.glint}")`;
      box.appendChild(g);
    }
    if (fx.blink) {
      fx.blink.eyes.forEach((e) => {
        box.appendChild(fxEl('vfx-lid', {
          '--x': `${e.x}%`, '--y': `${e.y}%`, '--w': `${e.w}%`, '--h': `${e.h}%`,
          '--fur': e.fur, '--lash': `${e.lash}px`,
          '--blink': `${fx.blink.dur}s`, '--blink-delay': `${fx.blink.delay}s`,
        }));
      });
    }
    (fx.stars || []).forEach(([x, y, size, glow], i) => {
      box.appendChild(fxEl('vfx-star', {
        '--x': `${x}%`, '--y': `${y}%`, '--s': `${size}%`, '--glow': glow || fx.glow,
        // 별마다 주기·시작을 어긋나게 해 한꺼번에 깜박이지 않게 한다.
        '--dur': `${(2.4 + (i % 3) * 0.55).toFixed(2)}s`, '--delay': `${(-i * 0.9).toFixed(2)}s`,
      }));
    });
  };

  const planet = document.querySelector('.planet[data-service-id="vocanb"]');
  if (!planet) return;
  const orbit = planet.querySelector('.planet-orbit');
  const sphere = planet.querySelector('.planet-sphere');

  const makeBubble = (c, below) => {
    const b = document.createElement('span');
    b.className = 'concept-bubble' + (below ? ' is-below' : '');
    b.setAttribute('role', 'tooltip');
    const t = document.createElement('span');
    t.className = 'concept-bubble-title';
    t.textContent = c.title;
    b.appendChild(t);
    c.body.forEach((line) => {
      const el = document.createElement('span');
      el.className = 'concept-bubble-line';
      el.textContent = line;
      b.appendChild(el);
    });
    return b;
  };

  const bar = document.createElement('div');
  bar.id = 'conceptSwitch';
  bar.setAttribute('role', 'group');
  bar.setAttribute('aria-label', 'voCANB 버튼 시안');
  const chips = CONCEPTS.map((c) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'concept-chip';
    chip.dataset.concept = c.key;
    const img = document.createElement('img');
    img.src = c.src;
    img.alt = '';
    const name = document.createElement('span');
    name.textContent = c.label;
    chip.append(img, name, makeBubble(c, true));
    chip.addEventListener('click', () => apply(c.key));
    bar.appendChild(chip);
    return chip;
  });
  document.body.appendChild(bar);

  planet.classList.add('has-concept');
  sphere.classList.add('is-artwork');
  sphere.style.background = 'none'; // renderServices 가 인라인으로 칠한 팔레트 그라데이션을 걷는다
  let bubble = null;

  // voCANB 는 맨 왼쪽 행성이라 좁은 창에서는 300px 말풍선이 화면 왼쪽 밖으로 나간다.
  // 열릴 때마다 재서 안쪽으로 밀고, 꼬리는 CSS 가 같은 값만큼 되돌린다.
  const EDGE = 12;
  const clampBubble = () => {
    if (!bubble) return;
    bubble.style.setProperty('--bubble-shift', '0px');
    const r = bubble.getBoundingClientRect();
    let shift = 0;
    if (r.left < EDGE) shift = EDGE - r.left;
    else if (r.right > window.innerWidth - EDGE) shift = window.innerWidth - EDGE - r.right;
    bubble.style.setProperty('--bubble-shift', `${Math.round(shift)}px`);
  };
  planet.addEventListener('mouseenter', clampBubble);
  planet.addEventListener('focus', clampBubble);

  const apply = (key) => {
    const c = CONCEPTS.find((x) => x.key === key) || CONCEPTS[0];
    sphere.textContent = '';
    const core = document.createElement('img');
    core.className = 'planet-icon' + (c.neon ? ' vocanb-core' : '');
    core.src = c.src;
    core.alt = '';
    sphere.appendChild(core);
    if (c.neon) {
      const ring = document.createElement('img');
      ring.className = 'vocanb-orbit';
      ring.src = c.src;
      ring.alt = '';
      sphere.appendChild(ring);
    }
    if (FX[c.key]) addFx(sphere, FX[c.key]);
    planet.classList.toggle('is-neon', !!c.neon);
    planet.dataset.concept = c.key;
    if (bubble) bubble.remove();
    bubble = makeBubble(c, false);
    orbit.appendChild(bubble);
    chips.forEach((chip) => {
      chip.setAttribute('aria-pressed', chip.dataset.concept === c.key ? 'true' : 'false');
    });
    // 주소 끝 #A/#B/#C 로 시안을 바로 열 수 있다 (새로고침해도 유지).
    try { history.replaceState(null, '', '#' + c.key); } catch (e) { /* file:// 에서 막혀도 무해 */ }
  };

  const fromHash = () => {
    const k = (location.hash || '').slice(1).toUpperCase();
    return CONCEPTS.some((c) => c.key === k) ? k : null;
  };
  apply(fromHash() || 'A');
  // 주소창에서 #B 처럼 바꾸면 문서를 다시 읽지 않으므로 직접 따라간다.
  window.addEventListener('hashchange', () => { const k = fromHash(); if (k) apply(k); });
})();
